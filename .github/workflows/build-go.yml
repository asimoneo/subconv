name: Build Go Decryptor

on:
  push:
    paths:
      - 'happ-decrypt.go'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Init Go Module
        run: |
          go mod init subconv
          go get golang.org/x/crypto/chacha20poly1305
          go mod tidy

      - name: Build for OpenWrt (aarch64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o happ-decrypt happ-decrypt.go

      - name: Commit binary to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add happ-decrypt go.mod go.sum
          git commit -m "Auto-compile happ-decrypt binary" || echo "No changes to commit"
          git push
